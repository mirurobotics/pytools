[build-system]
requires = ["hatchling==1.33.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "pytools"
dynamic = ["version"]
description = "Shared Python development tools for Miru repositories."
requires-python = ">=3.12"
dependencies = [
    "mypy==2.4.1",
    "ruff==0.17.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
]

[project.scripts]
pytools = "pytools.__main__:main"

[tool.hatch.version]
source = "vcs"
# Shallow checkouts have no tags to version from.
fallback-version = "0.0.0"
