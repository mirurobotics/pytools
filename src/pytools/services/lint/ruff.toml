line-length = 88
target-version = "py312"

[lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "N", "S", "RET", "PT", "PTH", "BLE",
    "ARG", "ANN", "RUF", "PLR0913", "T20", "TD003", "ICN", "N999",
]

[lint.pylint]
max-args = 6

# Paths resolve against the working directory, since lint passes this file
# with --config.
[lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/test_*.py" = ["S101"]
"**/__main__.py" = ["T20"]
"**/cli.py" = ["T20"]
